name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Current stable used for every build job. The analyze job also runs the
  # declared floor (pubspec `flutter: ">=3.44.0"`).
  FLUTTER_VERSION: 3.47.x
  # Meta's DAT 1.0 binaries are built with Swift 6.3.3 (Xcode 26.4+).
  XCODE_VERSION: '26.6'
  PACKAGES: . example samples/camera_access samples/display_access samples/glasses_companion

jobs:
  analyze-test:
    name: Dart (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.x', '3.44.x']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: pub get
        run: for p in $PACKAGES; do (cd "$p" && flutter pub get); done

      - name: Format
        if: matrix.flutter == '3.47.x'
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/integration_test samples

      - name: Analyze
        run: for p in $PACKAGES; do (cd "$p" && flutter analyze --fatal-infos --fatal-warnings) || exit 1; done

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate (models, method channel, error mapping)
        run: dart run tool/coverage_gate.dart --min 90

      - name: Channel parity (Dart / Swift / Kotlin)
        run: dart run tool/check_channel_parity.dart

      - name: Version consistency
        run: dart run tool/check_versions.dart

      - name: Publish dry-run
        if: matrix.flutter == '3.47.x'
        run: flutter pub publish --dry-run

      - name: pana
        if: matrix.flutter == '3.47.x'
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build example (debug)
        working-directory: example
        run: flutter build apk --debug

      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :meta_wearables_dat_flutter:testDebugUnitTest

      - name: Merged manifest contains the plugin's service and permissions
        run: |
          m=$(find example/build/app/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          for needle in FOREGROUND_SERVICE_CONNECTED_DEVICE POST_NOTIFICATIONS BackgroundStreamingService; do
            grep -q "$needle" "$m" || { echo "::error::$needle missing from merged manifest"; exit 1; }
          done

      - name: Build example (release, R8)
        working-directory: example
        run: flutter build apk --release

      - name: Build example without experimental modules
        working-directory: example
        run: flutter build apk --debug --android-project-arg=mwdat.experimental=false

      - name: Build samples
        run: |
          for s in samples/camera_access samples/display_access samples/glasses_companion; do
            (cd "$s" && flutter build apk --debug) || exit 1
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: example/build/meta_wearables_dat_flutter/reports

  ios:
    name: iOS build + unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/meta_wearables_dat_flutter/Package.swift') }}

      - name: Build example (simulator)
        working-directory: example
        run: flutter build ios --debug --simulator

      - name: Swift unit tests (RunnerTests)
        # XCTest enumerates every Objective-C class at start-up. Below iOS 26
        # that aborts inside MWDATCore (it weakly links iOS 26-only Network /
        # WiFiAware types), so native unit tests run on the newest runtime.
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -only-testing:RunnerTests \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' | tail -40

      - name: Build example archive (no codesign)
        working-directory: example
        run: flutter build ipa --no-codesign

      - name: Build samples (simulator)
        run: |
          for s in samples/camera_access samples/display_access samples/glasses_companion; do
            (cd "$s" && flutter build ios --debug --simulator) || exit 1
          done

  integration-ios:
    name: Integration (iOS Simulator, Mock Device Kit)
    runs-on: macos-26
    needs: ios
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Boot simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rt=sorted(k for k in d if "iOS" in k)[-1]
          print(next(x["udid"] for x in d[rt] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        working-directory: example
        run: flutter test integration_test/plugin_test.dart -d ${{ steps.sim.outputs.udid }}

  integration-android:
    name: Integration (Android emulator, Mock Device Kit)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: example
          script: flutter test integration_test/plugin_test.dart -d emulator-5554
