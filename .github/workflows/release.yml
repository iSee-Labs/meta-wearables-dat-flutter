name: Release

# Publishes to pub.dev when a version tag is pushed (v1.2.3 or v1.2.3-rc.1).
# Requires: pub.dev automated publishing enabled for this repository with
# tag pattern `v{{version}}`, and a GitHub environment named `pub.dev`
# with required reviewers (manual approval gate).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
      - run: flutter pub get
      - name: Tag matches every version declaration
        run: dart run tool/check_versions.dart --tag "${GITHUB_REF_NAME}"

  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
      - run: flutter pub get
      - name: Publish
        # pub exchanges the GitHub OIDC token for a pub.dev token itself.
        run: flutter pub publish --force

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
