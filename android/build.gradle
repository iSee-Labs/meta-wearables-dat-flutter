// Android Gradle module for the meta_wearables_dat_flutter plugin.
//
// Meta's Wearables Device Access Toolkit (DAT) 1.0 is published to Maven
// Central under `com.meta.wearable:mwdat-*`. No access token or extra
// repository is required.
//
// Experimental DAT capabilities
// -----------------------------
// DAT 1.0 ships three experimental modules (`mwdat-inputs`, `mwdat-motion`,
// `mwdat-speech`). Meta marks them `@Unpublishable`: apps that use them can
// be built and tested but cannot ship to production release channels. They
// are linked by default so every plugin API works out of the box. To drop
// them from your app, add this to your app's `android/gradle.properties`:
//
//     mwdat.experimental=false
//
// The plugin then compiles stub implementations that fail every
// experimental call with `EXPERIMENTAL_NOT_LINKED`.

group = "com.iseelabs.meta_wearables_dat_flutter"
version = "1.0.0-rc.1"

ext.mwdat_version = "1.0.0"

def mwdatExperimental = (project.findProperty("mwdat.experimental") ?: "true")
        .toString()
        .toBoolean()

buildscript {
    ext.kotlin_version = "2.2.21"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.iseelabs.meta_wearables_dat_flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        main.java.srcDirs += mwdatExperimental ? "src/experimental/kotlin" : "src/noexperimental/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk = 31
        consumerProguardFiles("consumer-rules.pro")
        buildConfigField("String", "PLUGIN_VERSION", "\"${project.version}\"")
        buildConfigField("String", "MWDAT_VERSION", "\"${mwdat_version}\"")
        buildConfigField("boolean", "EXPERIMENTAL_LINKED", "${mwdatExperimental}")
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError = true
        checkDependencies = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation("com.meta.wearable:mwdat-core:$mwdat_version")
    implementation("com.meta.wearable:mwdat-camera:$mwdat_version")
    implementation("com.meta.wearable:mwdat-display:$mwdat_version")
    // Mock Device Kit: lets host apps develop and test without glasses.
    implementation("com.meta.wearable:mwdat-mockdevice:$mwdat_version")
    if (mwdatExperimental) {
        implementation("com.meta.wearable:mwdat-inputs:$mwdat_version")
        implementation("com.meta.wearable:mwdat-motion:$mwdat_version")
        implementation("com.meta.wearable:mwdat-speech:$mwdat_version")
    }
    // ActivityResultRegistry / ComponentActivity for Meta's
    // RequestPermissionContract.
    implementation("androidx.activity:activity-ktx:1.10.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
    testImplementation("org.robolectric:robolectric:4.16")
}
